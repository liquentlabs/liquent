# Liquent Cluster Configuration - Bridge Cross-Epoch E2E Test Suite
# Node deployment configuration only (genesis params in genesis.toml)

[cluster]
name = "liquent-devnet-bridge-cross-epoch"
base_dir = "/tmp/liquent-cluster-bridge-cross-epoch"


[genesis_source]
genesis_path = "./artifacts/genesis.json"
waypoint_path = "./artifacts/waypoint.txt"

# Single genesis node
[[nodes]]
id = "node1"
role = "genesis"
source = { project_path = "../" }
host = "127.0.0.1"
validator_port = 6182
vfn_port = 6192
rpc_port = 8545
metrics_port = 9003
inspection_port = 10002
https_port = 1024
authrpc_port = 8575
reth_p2p_port = 12026

[faucet_init]
num_accounts = 0
